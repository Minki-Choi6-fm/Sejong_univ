<head>
    <meta name="viewport" content="width:device-width, initial-scale=1.0">
    <style>
        #header{grid-area: header;background-color: chocolate;}
        #menu{grid-area: men;background-color: rgb(38, 38, 138);}
        #content{grid-area: conten;background-color: rgb(38, 38, 138);}
        #sidebar{grid-area: sidebar;background-color: rgb(41, 160, 114);}
        #footer{grid-area: footer;background-color: rgb(210, 105, 30);}
        .container{
            display:grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 3fr 1fr;
            grid-template-areas:
            'header header header'
            'men conten sidebar'
            'footer footer footer';
            gap: 10px;
        }
        @media screen and (max-width:768px){
            .container{
                grid-template-columns: 1fr 3fr;
                grid-template-rows: 1fr 2fr 1fr 1fr;
                grid-template-areas:
                'header header'
                'men conten'
                'sidebar sidebar'
                'footer footer';
                gap:10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="header">header</div>
        <div id="menu">menu</div>
        <div id="content">main</div>
        <div id="sidebar">sidebar</div>
        <div id="footer">footer</div>
    </div>
</body>
