<body>
    <script>
        function sub(){
            document.getElementById("text").style.fontSize="14px";    
            document.getElementById("text").style.color="blue";    
        }
    </script>
    <p id="text">Javascript로 문단의 폰트, 글자 크기, 색상을 변경할 수 있나요?</p>
    <button onclick="sub()" type="button">스타일 변경</button> 
</body>
