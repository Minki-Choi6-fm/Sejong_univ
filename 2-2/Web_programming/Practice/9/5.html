<body>
    <input type="button" onclick="sub()" value="랜덤 이미지 표시">
    <img src="/Media/bird.png" id="image">
    <script>
        function sub(){
            let s=["/Media/bird.png","/Media/cat.png","/Media/dog.png"];
            let rand=Math.floor(Math.random()*3);
            document.getElementById("image").src=s[rand];
        }
    </script>
</body>
