<body>
    <img src="/Media/bird.png" id="image"><br>
    <input type="button" onclick="left()" value="왼쪽 이동"><input type="button" onclick="right()" value="오른쪽 이동">
    <script>
        function left(){
            document.getElementById("image").style="float:left;";
        }
        function right(){
            document.getElementById("image").style="float:right;";
        }
    </script>
</body>
