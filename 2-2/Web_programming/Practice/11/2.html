<canvas id="canva" width="600" height="400"></canvas>
<button onclick="sub()" type="button">찡그리기</button>
<script>
    let canvas=document.getElementById("canva");
    let context=canvas.getContext('2d');

        context.clearRect(0,0,600,400);

        context.beginPath();
        context.moveTo(320,100);
        context.arc(260,100,50,0,2*Math.PI,true);
        context.fill();

        context.beginPath();
        context.moveTo(300,300);
        context.arc(200,300,100,0,1*Math.PI,true);
        context.stroke();
    }
