<head>
    <style>
        table,td{border:1px solid black;}
    </style>
</head>
<body>
    <table id="test">
        <tr><td>(1,1)셀</td><td>(2,1)셀</td></tr>
        <tr><td>(1,2)셀</td><td>(2,2)셀</td></tr>
    </table>
    <br>
    <button onclick="sub()">행 추가</button>
    <script>
        function sub(){
            let table=document.getElementById("test");
            let row=table.insertRow(0);
            let cell1=row.insertCell(0);
            let cell2=row.insertCell(1);
            cell1.innerHTML="새로운 셀(1,1)";
            cell2.innerHTML="새로운 셀(1,2)";
        }
    </script>
</body>
