<body>
    <p id="test">This is a paragraph.</p>
    <input type="button" onclick="sub()" value="Click">
    <script>
        function sub(){
            document.getElementById("test").style.color="red";
            document.getElementById("test").style.fontFamily="san-serif";
            document.getElementById("test").style.fontStyle="italic";
        }
    </script>
</body>
