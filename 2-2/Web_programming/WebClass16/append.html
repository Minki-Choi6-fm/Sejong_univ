<body>
    <script>
        function addNode(e){
            let node=document.createElement("p");
            node.innerHTML=e;
            document.getElementById("target").appendChild(node);
        }
    </script>
    <div id="target" onclick="addNode('동적으로 텍스트 추가')" style="font:20px italic;">click here</div>
</body>
