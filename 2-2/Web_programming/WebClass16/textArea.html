<body>
    <textarea id="from" rows="5" cols="20"></textarea>
    <input type="button" onclick="sub()" value="Click">
    <textarea id="to" rows="5" cols="20"></textarea>

    <script>
        function sub(){
            let s=document.getElementById("from").value;
            document.getElementById("to").value=s;
        }
    </script>
</body>
