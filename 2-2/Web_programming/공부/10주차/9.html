<!DOCTYPE html>
<html>
<head>
    <title>자바 스크립트 폼 검증</title>
    <script>
        function check() {
            let phone = document.getElementById("phone");
            let pwd = document.getElementById("pwd");
            let phoneExp = /^\d{3}-\d{3,4}-\d{4}$/;

            if (!phone.value.match(phoneExp)) {
                alert("올바른 전화번호를 입력하시오!");
                phone.focus();
                return false;
            }

            if (pwd.value.length < 6 || pwd.value.length > 8) {
                alert("패스워드는 6~8 글자이어야 합니다.");
                pwd.focus();
                return false;
            }

            return true;
        }
    </script>
</head>
<body>
    <h2>회원 신청서</h2>
    <form onsubmit="return check()">
        이름*: <input type="text"><br>
        성별*: <input type="radio" name="gender" checked>남성 <input type="radio" name="gender">여성<br>
        휴대폰 번호Phone*: <input type="text" id="phone"><br>
        이메일*: <input type="text"><br>
        패스워드(6-8 글자)*: <input type="password" id="pwd"><br>
        패스워드 검증*: <input type="password"><br>
        <input type="submit" value="제출">
        <input type="reset" value="지우기">
    </form>
</body>
</html>
