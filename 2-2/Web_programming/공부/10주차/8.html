<body>
    <img src="/Media/google.png" id="image" onclick="sub()" width="200px" height="200px">
    
    <script>
        let isChanged = false;

        function sub(){
            let s = document.getElementById("image");

            if (isChanged == false) {
                s.src = "/Media/bird.jpeg"; 
                isChanged = true;           
            } else {
                s.src = "/Media/google.png"; 
                isChanged = false;          
            }
        }
    </script>
</body>
