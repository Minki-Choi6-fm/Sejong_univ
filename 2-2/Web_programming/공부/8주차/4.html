<h1 id="text"></h1>
<script>
    function sub(){
        let start=new Date();
        let before=start.getTime();
        let cal=0;
        for(let i=0;i<=1000000;i++){
            cal+=i;
        }
        let end=new Date();
        let after=end.getTime();
        let time=after-before;
        document.getElementById('text').innerHTML=time+"밀리초가 걸렸음!";
    }
    sub();
</script>
