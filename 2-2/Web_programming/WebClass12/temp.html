<body>
    <h1>구구단표</h1>
    <table border="1">
        <script>
            for(let i=1;i<10;i++){
                document.write("<tr>")
                for(let j=1;j<10;j++){
                    document.write("<td>"+i*j+"</td>");
                }
                document.write("</tr>");
            }
        </script>
    </table>
</body>
